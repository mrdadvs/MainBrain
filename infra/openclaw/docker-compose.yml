services:
  # MainBrain Discord Test Agent - Gateway
  # Official OpenClaw image from Docker Hub: openclaw/openclaw:2026.11.1
  # Image digest: sha256:db0e0809fbd0df375445e9eea8daf2a278ac7ac3a263fa6bfce8fb344ad3ad77
  # Source: https://hub.docker.com/r/openclaw/openclaw
  openclaw-gateway:
    image: openclaw/openclaw:2026.11.1@sha256:db0e0809fbd0df375445e9eea8daf2a278ac7ac3a263fa6bfce8fb344ad3ad77
    container_name: openclaw-gateway
    restart: unless-stopped
    init: true
    
    env_file:
      - path: .env
        required: false
    
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      
      # Pin container-side state paths to prevent host path leakage
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      
      # Gateway configuration: lan binding inside Docker, published to localhost only
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      
      # Disable Bonjour in container environment
      OPENCLAW_DISABLE_BONJOUR: "1"
      
      # Discord integration
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      
      # AI Provider credentials
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      
      # Alternative providers (optional)
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      
      # Agent restrictions: chat-only pilot (no external tools, no file access)
      AGENT_CHAT_ONLY: "true"
      AGENT_DISABLE_SKILLS: "true"
      
      # Timezone
      TZ: ${OPENCLAW_TZ:-UTC}
    
    volumes:
      # Persistent state directory: config, cache, logs
      - type: bind
        source: "${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}"
        target: /home/node/.openclaw
        bind:
          propagation: rprivate
      # Workspace for agent operations (chat history, temp files)
      - type: bind
        source: "${OPENCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.openclaw/workspace}"
        target: /home/node/.openclaw/workspace
        bind:
          propagation: rprivate
      # Auth profile secrets (protected local files)
      - type: bind
        source: "${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.openclaw-auth-profile-secrets}"
        target: /home/node/.config/openclaw
        bind:
          propagation: rprivate
    
    ports:
      # Gateway only accessible from localhost (not remotely accessible)
      - "127.0.0.1:18789:18789"
    
    # Security: drop unnecessary capabilities, no new privileges
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    
    security_opt:
      - no-new-privileges:true
    
    # Health check using official OpenClaw health check script
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    
    # Start gateway using official OpenClaw command
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "lan",
        "--port",
        "18789",
      ]
    
    networks:
      - openclaw-network
    
    # Resource limits (adjust based on available hardware)
    # Uncomment to enable resource constraints
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

  # CLI service for manual gateway interaction (optional)
  openclaw-cli:
    image: openclaw/openclaw:2026.11.1@sha256:db0e0809fbd0df375445e9eea8daf2a278ac7ac3a263fa6bfce8fb344ad3ad77
    network_mode: "service:openclaw-gateway"
    
    env_file:
      - path: .env
        required: false
    
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      
      # Pin container-side state paths
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      
      # Shared gateway network namespace: use its listener, not the .env host port
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      
      # Disable browser launching in CLI
      BROWSER: echo
      
      # Timezone
      TZ: ${OPENCLAW_TZ:-UTC}
    
    volumes:
      - type: bind
        source: "${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}"
        target: /home/node/.openclaw
        bind:
          propagation: rprivate
      - type: bind
        source: "${OPENCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.openclaw/workspace}"
        target: /home/node/.openclaw/workspace
        bind:
          propagation: rprivate
      - type: bind
        source: "${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.openclaw-auth-profile-secrets}"
        target: /home/node/.config/openclaw
        bind:
          propagation: rprivate
    
    # Security: drop unnecessary capabilities
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    
    security_opt:
      - no-new-privileges:true
    
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

networks:
  openclaw-network:
    driver: bridge
